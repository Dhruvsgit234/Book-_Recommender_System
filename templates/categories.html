<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Categories - Book Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            color: #fafafa;
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .navbar {
            background: linear-gradient(90deg, #1f1c2c 0%, #09c6f9 100%);
            box-shadow: 0 4px 25px 0 rgba(9, 198, 249, 0.15);
            border-bottom: 0.5px solid rgba(148,255,251,0.19);
            padding: 15px 0;
        }
        .navbar-brand {
            font-size: 2.2rem;
            color: #fafafa !important;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #09c6f9, 0 2px 8px #000B;
        }
        .nav-link {
            color: #eeeeee !important;
            font-size: 1.1rem;
            margin: 0 4px;
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 18px;
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(9,198,249,0.2);
            color: #34d1ff !important;
            box-shadow: 0 0 12px 0 #09c6f9AA;
        }
        .page-header {
            text-align: center;
            padding: 60px 0 40px;
            background: linear-gradient(135deg, rgba(9,198,249,0.1) 0%, rgba(0,224,211,0.1) 100%);
            border-radius: 0 0 50px 50px;
            margin-bottom: 50px;
        }
        .page-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #09c6f9 0%, #00e0d3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .page-subtitle {
            font-size: 1.2rem;
            color: #b8d4e3;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .category-card {
            background: rgba(30,32,36,0.9);
            border: 2px solid rgba(9,198,249,0.2);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            transition: all 0.3s cubic-bezier(.4,2,.7,1);
            text-decoration: none;
            display: block;
            position: relative;
            overflow: hidden;
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(9,198,249,0.1), transparent);
            transition: left 0.5s;
        }
        .category-card:hover::before {
            left: 100%;
        }
        .category-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #09c6f9;
            box-shadow: 0 15px 40px rgba(9,198,249,0.3);
            background: linear-gradient(135deg, rgba(30,32,36,0.95) 0%, rgba(20,33,61,0.95) 100%);
        }
        .category-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }
        .category-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00e0d3;
            margin-bottom: 12px;
        }
        .category-desc {
            color: #b8d4e3;
            font-size: 1rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📚 BookRecommender</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/recommend">Similar Books</a></li>
                <li class="nav-item"><a class="nav-link" href="/mood">Mood Search</a></li>
                <li class="nav-item"><a class="nav-link active" href="/categories">Categories</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Explore by Category</h1>
            <p class="page-subtitle">Browse books by genre, theme, and reading preferences</p>
        </div>
    </div>

    <div class="container">
        <div class="category-grid">
            {% for category in categories %}
            <a href="/category_books/{{ category.slug }}" class="category-card">
                <span class="category-icon">{{ category.icon }}</span>
                <h3 class="category-name">{{ category.name }}</h3>
                <p class="category-desc">{{ category.desc }}</p>
            </a>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
