<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mood & Emotion Search - Book Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        body {
            background: #0a0a0f;
            font-family: 'Space Grotesk', 'Montserrat', sans-serif;
            color: #fafafa;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(9,198,249,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,224,211,0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(147,51,234,0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
            z-index: -1;
            pointer-events: none;
        }
        
        .navbar {
            background: rgba(15,15,20,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(9,198,249,0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: fadeInUp 0.8s ease;
        }
        
        .navbar-brand {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #09c6f9 0%, #00e0d3 50%, #9333ea 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -1px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .navbar-brand:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        
        .nav-link {
            color: #b8d4e3 !important;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 8px;
            padding: 10px 20px !important;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        
        .nav-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(9,198,249,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .nav-link:hover::before,
        .nav-link.active::before {
            width: 300px;
            height: 300px;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #09c6f9 !important;
            transform: translateY(-3px);
            background: rgba(9,198,249,0.1);
        }
        .page-header {
            text-align: center;
            padding: 100px 0 60px;
            margin-bottom: 60px;
            animation: fadeInUp 1s ease;
        }
        
        .page-title {
            font-size: 4.5rem;
            font-weight: 900;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #09c6f9 0%, #00e0d3 50%, #9333ea 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        
        .page-subtitle {
            font-size: 1.4rem;
            color: #b8d4e3;
            font-weight: 400;
        }
        
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin: 50px 0;
        }
        
        .mood-card {
            background: rgba(20,20,30,0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(9,198,249,0.2);
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease backwards;
        }
        
        .mood-card:nth-child(1) { animation-delay: 0.1s; }
        .mood-card:nth-child(2) { animation-delay: 0.2s; }
        .mood-card:nth-child(3) { animation-delay: 0.3s; }
        .mood-card:nth-child(4) { animation-delay: 0.4s; }
        .mood-card:nth-child(5) { animation-delay: 0.5s; }
        .mood-card:nth-child(6) { animation-delay: 0.6s; }
        .mood-card:nth-child(7) { animation-delay: 0.7s; }
        .mood-card:nth-child(8) { animation-delay: 0.8s; }
        .mood-card input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        .mood-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, #09c6f9, #00e0d3);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .mood-card:hover::before {
            opacity: 1;
        }
        
        .mood-card:hover {
            transform: translateY(-12px) scale(1.05);
            border-color: #09c6f9;
            box-shadow: 0 20px 60px rgba(9,198,249,0.5);
            background: rgba(20,20,30,0.9);
        }
        
        .mood-card input[type="checkbox"]:checked + .mood-content {
            background: linear-gradient(135deg, rgba(9,198,249,0.2) 0%, rgba(0,224,211,0.2) 100%);
            border-color: #00e0d3;
            box-shadow: 0 0 30px rgba(0,224,211,0.6);
            transform: scale(1.05);
        }
        
        .mood-emoji {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(9,198,249,0.5));
        }
        
        .mood-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #00e0d3;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #09fbd3 0%, #0083fe 100%);
            color: #0a0a0f;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 18px 60px;
            border-radius: 20px;
            border: none;
            box-shadow: 0 8px 30px rgba(9,198,249,0.4);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            margin-top: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .submit-btn:hover::before {
            width: 500px;
            height: 500px;
        }
        
        .submit-btn:hover {
            background: linear-gradient(135deg, #34d1ff 0%, #09fbd3 100%);
            color: #fff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 50px rgba(9,198,249,0.6);
        }
        .error-message {
            color: #ef3061;
            font-size: 1.2rem;
            margin-top: 20px;
            text-align: center;
            text-shadow: 0 0 8px #ef306144;
        }
        .mood-mapping {
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📚 BookRecommender</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/recommend">Similar Books</a></li>
                <li class="nav-item"><a class="nav-link active" href="/mood">Mood Search</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Find Books by Mood & Emotion</h1>
            <p class="page-subtitle">Select one or more moods to discover books that match how you want to feel</p>
        </div>
    </div>

    <div class="container">
        <form action="/mood_books" method="POST">
            <div class="mood-grid">
                {% for mood in moods %}
                <label class="mood-card">
                    <input type="checkbox" name="moods" value="{{ mood }}">
                    <div class="mood-content">
                        <span class="mood-emoji">
                            {% if mood == 'happy' %}😊
                            {% elif mood == 'sad' %}😢
                            {% elif mood == 'funny' %}😂
                            {% elif mood == 'serious' %}🤔
                            {% elif mood == 'romantic' %}💕
                            {% elif mood == 'mystery' %}🔍
                            {% elif mood == 'adventure' %}🗺️
                            {% elif mood == 'inspiring' %}✨
                            {% endif %}
                        </span>
                        <div class="mood-name">{{ mood|title }}</div>
                    </div>
                </label>
                {% endfor %}
            </div>
            
            <div class="text-center">
                <button type="submit" class="submit-btn">Discover Books</button>
            </div>
        </form>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
